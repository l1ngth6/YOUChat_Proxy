name: Sync Upstream and Build Docker

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_REPOSITORY: you_proxy
  UPSTREAM_BRANCH: bypass-cf

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check_upstream.outputs.has_upstream_changes }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.UPSTREAM_BRANCH }}
          
      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Check for upstream changes
        id: check_upstream
        run: |
          # Add upstream remote
          git remote add upstream https://github.com/YIWANG-sketch/YOUChat_Proxy.git || true
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}
          
          # Find the last commit that was synced from upstream
          LAST_SYNC_HASH=$(git log --grep="Sync with upstream" -n 1 --format="%H" || echo "")
          
          if [ -z "$LAST_SYNC_HASH" ]; then
            # First time syncing, definitely need to sync
            echo "First time syncing with upstream"
            echo "has_upstream_changes=true" >> $GITHUB_OUTPUT
          else
            # Find the common ancestor between our last sync and current upstream
            COMMON_ANCESTOR=$(git merge-base $LAST_SYNC_HASH upstream/${{ env.UPSTREAM_BRANCH }})
            
            # Check if upstream has new commits since our last sync
            if [ "$COMMON_ANCESTOR" = "$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})" ]; then
              echo "No new changes in upstream since last sync"
              echo "has_upstream_changes=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "New changes detected in upstream"
              echo "has_upstream_changes=true" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Backup local customization files
        if: steps.check_upstream.outputs.has_upstream_changes == 'true'
        run: |
          if [ -f "Dockerfile" ]; then
            cp Dockerfile Dockerfile.backup
          fi
          if [ -f ".github/workflows/sync-upstream.yml" ]; then
            mkdir -p .github/workflows.backup
            cp .github/workflows/sync-upstream.yml .github/workflows.backup/
          fi

      - name: Sync with upstream
        if: steps.check_upstream.outputs.has_upstream_changes == 'true'
        run: |
          # Hard reset to upstream state
          git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}
          echo "Reset to upstream complete"
          
          # Restore local customization files
          if [ -f "Dockerfile.backup" ]; then
            cp Dockerfile.backup Dockerfile
            rm Dockerfile.backup
          fi
          if [ -f ".github/workflows.backup/sync-upstream.yml" ]; then
            mkdir -p .github/workflows/  # 确保目标目录存在
            cp .github/workflows.backup/sync-upstream.yml .github/workflows/
            rm -rf .github/workflows.backup
          fi
          
          # Commit and push changes
          git add -A
          git commit -m "Sync with upstream, preserving local customizations"
          git push origin ${{ env.UPSTREAM_BRANCH }} --force

  build-and-push:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_BRANCH }}
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get current timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:${{ steps.timestamp.outputs.timestamp }}-x86
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:buildcache,mode=max

      - name: Workflow Summary
        run: |
          echo "Docker image built and pushed successfully"
          echo "Tags:"
          echo "- ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:latest"
          echo "- ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_REPOSITORY }}:${{ steps.timestamp.outputs.timestamp }}-x86"
